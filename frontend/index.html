<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>GrowFox | Premier Influencer Marketing & Brand Collaboration Platform</title>
    <meta name="title" content="GrowFox | Premier Influencer Marketing & Brand Collaboration Platform" />
    <meta name="description" content="Discover top verified creators, launch high-ROI influencer marketing campaigns, and collaborate seamlessly with secured milestone payments on GrowFox." />
    <meta name="keywords" content="influencer marketing, hire creators, UGC creators, brand deals, creator sponsorship, influencer campaigns, GrowFox, social media marketing, content creators" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="GrowFox" />
    <link rel="canonical" href="https://growfox.in/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://growfox.in/" />
    <meta property="og:site_name" content="GrowFox" />
    <meta property="og:title" content="GrowFox | Premier Influencer Marketing & Brand Collaboration Platform" />
    <meta property="og:description" content="Connect with verified creators and launch performance-driven brand campaigns with secured milestone payments." />
    <meta property="og:image" content="https://growfox.in/growfox.png" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://growfox.in/" />
    <meta name="twitter:title" content="GrowFox | Premier Influencer Marketing & Brand Collaboration Platform" />
    <meta name="twitter:description" content="Connect with verified creators and launch performance-driven brand campaigns with secured milestone payments." />
    <meta name="twitter:image" content="https://growfox.in/growfox.png" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" href="/growfox-g.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/growfox-g.png" />

    <!-- Preconnect to external CDNs for faster DNS resolution & TLS handshakes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Manrope:wght@200..800&display=swap" />

    <!-- Schema.org JSON-LD Structured Data for Google Knowledge Graph & Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://growfox.in/#organization",
          "name": "GrowFox",
          "url": "https://growfox.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://growfox.in/growfox.png",
            "caption": "GrowFox Logo"
          },
          "description": "Influencer and brand collaboration marketplace empowering creators with secured milestone payouts and high-converting marketing campaigns.",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@brandfinity.in",
            "contactType": "Customer Support"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://growfox.in/#website",
          "url": "https://growfox.in",
          "name": "GrowFox",
          "publisher": {
            "@id": "https://growfox.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://growfox.in/creators?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
